# Render Blueprint — https://render.com/docs/blueprint-spec
# New > Blueprint > pick this repo. You'll be asked for the secret keys.
services:
  - type: web
    name: careerflow-ai
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: RATE_LIMIT_AI_PER_MINUTE
        value: "20"
