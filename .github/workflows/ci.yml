name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install
        run: pip install -r backend/requirements-dev.txt
      - name: Test
        working-directory: backend
        run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t careerflow-ai .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name cf careerflow-ai
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/api/health && exit 0; sleep 2; done
          docker logs cf; exit 1
